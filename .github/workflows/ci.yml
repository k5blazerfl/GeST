name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check gest/ tests/

      - name: Build the package
        run: python -m build

      # The pure, dependency-light tests run here. The urwid frontend tests run in
      # the separate `tui-test` job (they need GLib/dbus-next). The reader tests
      # need a live Portage DB, so they stay Gentoo-host-only.
      - name: Test (CI-safe subset)
        run: |
          pytest tests/test_news.py tests/test_preview.py \
                 tests/test_services_reader.py tests/test_selection.py \
                 tests/test_users_reader.py tests/test_users_commands.py \
                 tests/test_system_core.py tests/test_audit.py \
                 tests/test_network_core.py tests/test_overlay_manifest.py \
                 tests/test_cleanup.py tests/test_update.py tests/test_sync.py \
                 tests/test_mirrors.py tests/test_edit.py tests/test_sshkey.py \
                 tests/test_disk_core.py tests/test_disk_provision.py tests/test_exec.py \
                 tests/test_disk_mount_target.py tests/test_system_console.py \
                 tests/test_network_dns_hosts.py tests/test_firewall.py tests/test_sshd.py \
                 tests/test_firewalld.py tests/test_firewall_detect.py \
                 tests/test_privilege.py tests/test_sysctl.py tests/test_envd.py \
                 tests/test_wifi.py tests/test_rootpath.py \
                 tests/test_bootloader_install.py tests/test_kernel_build.py \
                 tests/test_stage3.py tests/test_chroot.py tests/test_install_engine.py \
                 tests/test_install_registry.py tests/test_install_bootable.py \
                 tests/test_install_state.py tests/test_install_assemble.py tests/test_install_netcheck.py -q

      - name: Syntax-check the ebuilds
        run: |
          for e in packaging/overlay/app-admin/gest/*.ebuild; do bash -n "$e"; done

  tui-test:
    # The urwid frontend tests. urwid pulls in GLib (gi) via its event loop, so we
    # give a venv access to the runner's apt-installed python3-gi (rather than
    # compiling PyGObject) and add the pip-only deps on top.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GLib introspection (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0

      - name: Set up a venv that can see system python3-gi
        run: |
          python3 -m venv --system-site-packages .tuivenv
          .tuivenv/bin/pip install --upgrade pip
          .tuivenv/bin/pip install urwid dbus-next pytest pytest-asyncio

      - name: Sanity-check the TUI stack imports
        run: .tuivenv/bin/python -c "import gi; from gi.repository import GLib; import urwid, dbus_next; import gest.tui.screens.menu"

      - name: Test (urwid frontend)
        run: .tuivenv/bin/pytest tests/test_tui.py -q
