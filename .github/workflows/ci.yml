name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff build pytest pytest-asyncio cryptography

      - name: Lint (ruff)
        run: ruff check gest/ tests/

      - name: Build the package
        run: python -m build

      # Only the pure, dependency-light tests run here. The urwid frontend tests
      # (test_tui) and the reader tests import the Portage Python API and pull in
      # PyGObject/GLib (via urwid), neither available on a stock Ubuntu runner —
      # those are validated on the Gentoo host (or a Gentoo-container job).
      - name: Test (CI-safe subset)
        run: |
          pytest tests/test_news.py tests/test_preview.py \
                 tests/test_services_reader.py tests/test_selection.py \
                 tests/test_users_reader.py tests/test_users_commands.py \
                 tests/test_system_core.py tests/test_audit.py \
                 tests/test_network_core.py tests/test_overlay_manifest.py \
                 tests/test_cleanup.py tests/test_update.py tests/test_sync.py \
                 tests/test_mirrors.py tests/test_edit.py tests/test_sshkey.py \
                 tests/test_disk_core.py tests/test_disk_provision.py tests/test_exec.py \
                 tests/test_disk_mount_target.py tests/test_system_console.py \
                 tests/test_network_dns_hosts.py tests/test_firewall.py tests/test_sshd.py \
                 tests/test_firewalld.py tests/test_firewall_detect.py \
                 tests/test_privilege.py tests/test_sysctl.py tests/test_envd.py \
                 tests/test_wifi.py tests/test_rootpath.py \
                 tests/test_bootloader_install.py tests/test_kernel_build.py \
                 tests/test_stage3.py tests/test_chroot.py tests/test_install_engine.py \
                 tests/test_install_registry.py tests/test_install_bootable.py \
                 tests/test_install_state.py tests/test_install_assemble.py \
                 tests/test_install_netcheck.py tests/test_software_sort.py tests/test_coreservice_hostname.py tests/test_coreservice_software.py tests/test_coreservice_services.py tests/test_coreservice_users.py tests/test_coreservice_network.py tests/test_coreservice_disk.py tests/test_coreservice_firewall.py tests/test_coreservice_localization.py tests/test_coreservice_sysctl.py tests/test_coreservice_catalog.py \
                 tests/test_keychain_model.py tests/test_keychain_vault.py \
                 tests/test_keychain_cli.py -q

      - name: Syntax-check the ebuilds
        run: |
          for e in packaging/overlay/app-admin/gest/*.ebuild; do bash -n "$e"; done

  tui-test:
    # test_tui imports the Portage Python API and pulls in PyGObject/GLib (via
    # urwid), neither of which exists on a stock Ubuntu runner. Run it in a Gentoo
    # container and pull the deps from the official binary host (fast, no compile).
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --user root
    steps:
      - name: Portage tree, binhost and TUI deps
        run: |
          set -eux
          emerge-webrsync
          mkdir -p /etc/portage/binrepos.conf
          printf '[gentoobinhost]\npriority = 1\nsync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/\n' \
            > /etc/portage/binrepos.conf/gentoobinhost.conf
          # skip binpkg signature enforcement in CI (keeps the deps step simple)
          echo 'FEATURES="-binpkg-request-signature"' >> /etc/portage/make.conf
          emerge --getbinpkg --quiet-build=y \
            dev-vcs/git dev-python/urwid dev-python/dbus-next dev-python/pygobject \
            dev-python/pytest dev-python/pytest-asyncio

      - uses: actions/checkout@v4

      - name: Test the urwid frontend
        # The `needs_live_system` tests query real disks / installed packages /
        # repos / @world updates, which a bare stage3 container lacks — those run
        # on the Gentoo host. Everything else (navigation, help, widget logic) runs
        # here, which is what catches menu-navigation rot.
        run: |
          python3 -c "import portage, gi; from gi.repository import GLib; import urwid, dbus_next; import gest.tui.screens.menu"
          python3 -m pytest tests/test_tui.py -m "not needs_live_system" -q

  cpp-reference:
    # Build the C++/Qt reference client (examples/hede-qt) so the qdbusxml2cpp path
    # — the exact way HeDE's C++/Qt Control Center consumes gestd — can't rot. The
    # CMake target generates and compiles a typed proxy for *every* interface XML
    # (Hostname/System/Software/Catalog), so a broken template — a bad D-Bus type or
    # a missing QtTypeName annotation on a container out-arg — fails this build even
    # before a view wires it up. No display and no gestd needed: this only compiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt6 + build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev

      - name: Build the reference client
        run: |
          set -eux
          cmake -S examples/hede-qt -B examples/hede-qt/build
          cmake --build examples/hede-qt/build
          test -x examples/hede-qt/build/gest-hede-ref
