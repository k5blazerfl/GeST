name: Overlay sync

# On every release tag, generate the ebuild + Manifest DIST from the tag tarball
# and update both overlays — so a bump can never ship without its Manifest.
#
#   * The authoritative overlay (packaging/overlay/, this repo) is committed to
#     main using the built-in GITHUB_TOKEN — always runs.
#   * The lean Amphitheater overlay is synced only when the AMPHI_DEPLOY_KEY
#     secret is present (an SSH deploy key with write access to
#     k5blazerfl/Amphitheater). Until you add it, this step is skipped and the
#     workflow still succeeds.
#
# NOTE: with this workflow enabled, do NOT hand-create the packaging commit —
# just bump + tag + push; the workflow adds gest-<ver>.ebuild + Manifest for you.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect Amphitheater deploy key
        id: amphi
        env:
          AMPHI_DEPLOY_KEY: ${{ secrets.AMPHI_DEPLOY_KEY }}
        run: |
          if [ -n "$AMPHI_DEPLOY_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMPHI_DEPLOY_KEY not set — updating the GeST overlay only; skipping Amphitheater sync."
          fi

      - name: Load Amphitheater deploy key
        if: steps.amphi.outputs.enabled == 'true'
        env:
          AMPHI_DEPLOY_KEY: ${{ secrets.AMPHI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          printf '%s\n' "$AMPHI_DEPLOY_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Generate + sync overlays
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git config user.name "k5blazerfl"
          git config user.email "k5blazerfl@fastmail.com"
          if [ "${{ steps.amphi.outputs.enabled }}" = "true" ]; then
            python packaging/release-overlay.py "$VER" --push
          else
            python packaging/release-overlay.py "$VER" --push --gest-only
          fi
