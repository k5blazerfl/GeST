<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Textant">
  <defs>
    <linearGradient id="i_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20334f"/><stop offset="1" stop-color="#0d1626"/></linearGradient>
    <radialGradient id="i_tileGlow" cx="0.5" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#31507a" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#16233a" stop-opacity="0"/></radialGradient>
    <linearGradient id="i_bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243654"/><stop offset="1" stop-color="#182740"/></linearGradient>
    <radialGradient id="i_screen" cx="0.5" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#0e1728"/><stop offset="1" stop-color="#080d18"/></radialGradient>
    <filter id="i_glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="i_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="i_winclip"><rect x="34" y="50" width="188" height="158" rx="22"/></clipPath>
    <clipPath id="i_tileclip"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>

  <!-- glass tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#i_tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#i_tileGlow)"/>
  <g clip-path="url(#i_tileclip)"><ellipse cx="128" cy="26" rx="150" ry="66" fill="#fff" opacity=".05"/></g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>

  <!-- terminal window -->
  <g filter="url(#i_shadow)">
    <rect x="34" y="50" width="188" height="158" rx="22" fill="url(#i_screen)"/>
    <g clip-path="url(#i_winclip)">
      <!-- titlebar -->
      <rect x="34" y="50" width="188" height="34" fill="url(#i_bar)"/>
      <circle cx="55" cy="67" r="4.6" fill="#e0743f"/>
      <circle cx="72" cy="67" r="4.6" fill="#d9a641"/>
      <circle cx="89" cy="67" r="4.6" fill="#57b98a"/>
      <!-- screen content -->
      <rect x="56" y="108" width="58" height="8" rx="4" fill="#33465f"/>
      <rect x="120" y="108" width="30" height="8" rx="4" fill="#2a3a52"/>
      <!-- prompt >_ -->
      <g filter="url(#i_glow)">
        <path d="M60 132 L78 148 L60 164" fill="none" stroke="#ffc247" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="90" y="139" width="24" height="18" rx="4.5" fill="#ffce62"/>
      </g>
    </g>
    <rect x="34" y="84" width="188" height="1.5" fill="#000" opacity=".35"/>
    <rect x="34.75" y="50.75" width="186.5" height="156.5" rx="21.25" fill="none"
          stroke="#d9a641" stroke-opacity=".35" stroke-width="1.5"/>
  </g>
</svg>
