<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Textant">
  <defs>
    <linearGradient id="e_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c48"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
    <radialGradient id="e_glow" cx="0.5" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#2a4368" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#16233a" stop-opacity="0"/></radialGradient>
    <linearGradient id="e_brass" gradientUnits="userSpaceOnUse" x1="86" y1="56" x2="172" y2="220">
      <stop offset="0" stop-color="#f7e1a0"/><stop offset=".45" stop-color="#d9a641"/>
      <stop offset="1" stop-color="#9c6a1f"/></linearGradient>
    <filter id="e_bglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffcf6b" flood-opacity=".35"/></filter>
    <filter id="e_pglow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="e_clip"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>

  <!-- glass tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#e_tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#e_glow)"/>
  <g clip-path="url(#e_clip)"><ellipse cx="128" cy="30" rx="150" ry="70" fill="#fff" opacity=".06"/></g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>

  <!-- Poseidon trident -->
  <g transform="translate(128 106) scale(0.82) translate(-128 -142)" stroke="url(#e_brass)"
     fill="url(#e_brass)" stroke-linecap="round" stroke-linejoin="round" filter="url(#e_bglow)">
    <path d="M128 132 L128 214" stroke-width="9" fill="none"/>
    <circle cx="128" cy="218" r="6" stroke="none"/>
    <path d="M116 176 L140 176" stroke-width="7" fill="none"/>
    <path d="M96 132 L160 132" stroke-width="9" fill="none"/>
    <path d="M128 132 L128 60" stroke-width="9" fill="none"/>
    <path d="M96 132 C 90 108 86 92 88 66" stroke-width="9" fill="none"/>
    <path d="M160 132 C 166 108 170 92 168 66" stroke-width="9" fill="none"/>
    <path d="M128 60 l 7 12 l -7 10 l -7 -10 z" stroke="none"/>
    <path d="M88 66 l 7 11 l -8 9 l -6 -11 z" stroke="none"/>
    <path d="M168 66 l 6 11 l -6 11 l -7 -9 z" stroke="none"/>
  </g>
  <!-- >_ prompt -->
  <g filter="url(#e_pglow)">
    <path d="M107 195 L123 207 L107 219" fill="none" stroke="#ffc247" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="133" y="200" width="20" height="15" rx="4" fill="#ffce62"/>
  </g>
</svg>
