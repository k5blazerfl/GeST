<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Textant">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2c48"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.5" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#2a4368" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#16233a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e1a0"/>
      <stop offset="0.45" stop-color="#d9a641"/>
      <stop offset="1" stop-color="#9c6a1f"/>
    </linearGradient>
    <linearGradient id="brassDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a641"/>
      <stop offset="1" stop-color="#7c5217"/>
    </linearGradient>
    <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tileClip"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>

  <!-- glass tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tileGlow)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="128" cy="30" rx="150" ry="70" fill="#ffffff" opacity="0.06"/>
  </g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- sextant -->
  <g filter="url(#softShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- graduated limb (arc) -->
    <path d="M 48.1 182.4 A 150 150 0 0 0 215.9 182.4" stroke="url(#brass)" stroke-width="13"/>
    <!-- graduation ticks -->
    <g stroke="#20304a" stroke-width="2.2" opacity="0.9">
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(-30 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(-24 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(-18 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(-12 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(-6 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(0 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(6 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(12 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(18 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(24 132 58)"/>
      <line x1="132" y1="208" x2="132" y2="197" transform="rotate(30 132 58)"/>
    </g>
    <!-- frame legs -->
    <path d="M 132 58 L 48.1 182.4" stroke="url(#brass)" stroke-width="9"/>
    <path d="M 132 58 L 215.9 182.4" stroke="url(#brass)" stroke-width="9"/>
    <!-- concentric inner frame arc (sextant lattice) -->
    <path d="M 97.5 143.3 A 92 92 0 0 0 166.5 143.3" stroke="url(#brassDark)" stroke-width="6"/>
    <!-- index arm -->
    <path d="M 132 58 L 168.3 203.5" stroke="url(#brassDark)" stroke-width="7"/>
    <circle cx="168.3" cy="203.5" r="7" fill="url(#brass)" stroke="none"/>
    <!-- telescope pointing up-left toward the prompt -->
    <path d="M 128 74 L 92 62" stroke="url(#brass)" stroke-width="11"/>
    <circle cx="90" cy="61.5" r="6.5" fill="#0b1220" stroke="url(#brass)" stroke-width="3"/>
    <!-- pivot / index mirror housing -->
    <circle cx="132" cy="58" r="10" fill="url(#brass)" stroke="#7c5217" stroke-width="2"/>
    <circle cx="132" cy="58" r="3.4" fill="#0b1220" stroke="none"/>
  </g>

  <!-- the sighted "star" = a terminal prompt >_ -->
  <g filter="url(#starGlow)">
    <path d="M 42 39 L 55 51 L 42 63" fill="none" stroke="#ffd36b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="61" y="52.5" width="18" height="7.5" rx="3.5" fill="#ffe19a"/>
  </g>
  <!-- sparkle -->
  <circle cx="90" cy="33" r="2.4" fill="#ffe9b0"/>
</svg>
