<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Textant">
  <defs>
    <linearGradient id="ib_tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20334f"/><stop offset="1" stop-color="#0d1626"/></linearGradient>
    <radialGradient id="ib_tileGlow" cx="0.5" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#31507a" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#16233a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ib_bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243654"/><stop offset="1" stop-color="#182740"/></linearGradient>
    <radialGradient id="ib_screen" cx="0.5" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#0e1728"/><stop offset="1" stop-color="#080d18"/></radialGradient>
    <filter id="ib_glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="ib_shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
    <clipPath id="ib_winclip"><rect x="34" y="50" width="188" height="158" rx="22"/></clipPath>
    <clipPath id="ib_tileclip"><rect x="8" y="8" width="240" height="240" rx="54"/></clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#ib_tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#ib_tileGlow)"/>
  <g clip-path="url(#ib_tileclip)"><ellipse cx="128" cy="26" rx="150" ry="66" fill="#fff" opacity=".05"/></g>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1.5"/>

  <g filter="url(#ib_shadow)">
    <rect x="34" y="50" width="188" height="158" rx="22" fill="url(#ib_screen)"/>
    <g clip-path="url(#ib_winclip)">
      <rect x="34" y="50" width="188" height="34" fill="url(#ib_bar)"/>
      <!-- trident app-emblem, left of the titlebar -->
      <g transform="translate(56 67) scale(0.165) translate(-128 -140)" stroke="#e2b455"
         fill="#e2b455" stroke-linecap="round" stroke-linejoin="round">
        <path d="M128 132 L128 214" stroke-width="11" fill="none"/>
        <circle cx="128" cy="218" r="7" stroke="none"/>
        <path d="M115 176 L141 176" stroke-width="9" fill="none"/>
        <path d="M96 132 L160 132" stroke-width="11" fill="none"/>
        <path d="M128 132 L128 60" stroke-width="11" fill="none"/>
        <path d="M96 132 C 90 108 86 92 88 66" stroke-width="11" fill="none"/>
        <path d="M160 132 C 166 108 170 92 168 66" stroke-width="11" fill="none"/>
        <path d="M128 60 l 8 13 l -8 11 l -8 -11 z" stroke="none"/>
        <path d="M88 66 l 8 12 l -9 10 l -7 -12 z" stroke="none"/>
        <path d="M168 66 l 7 12 l -7 12 l -8 -10 z" stroke="none"/>
      </g>
      <!-- prompt >_ on the first line -->
      <g filter="url(#ib_glow)">
        <path d="M58 100 L80 116 L58 132" fill="none" stroke="#ffc247" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="93" y="106" width="26" height="20" rx="5" fill="#ffce62"/>
      </g>
    </g>
    <rect x="34" y="84" width="188" height="1.5" fill="#000" opacity=".35"/>
    <rect x="34.75" y="50.75" width="186.5" height="156.5" rx="21.25" fill="none"
          stroke="#d9a641" stroke-opacity=".35" stroke-width="1.5"/>
  </g>
</svg>
