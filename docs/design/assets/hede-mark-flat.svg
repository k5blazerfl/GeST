<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="currentColor" role="img" aria-label="HeDE mark (single colour)">
  <title>HeDE mark — single colour</title>
  <defs>
    <mask id="hubH">
      <rect x="0" y="0" width="200" height="200" fill="black"/>
      <circle cx="100" cy="100" r="25" fill="white"/>
      <rect x="89.5" y="88"  width="7"  height="24" fill="black"/>
      <rect x="103.5" y="88" width="7"  height="24" fill="black"/>
      <rect x="89.5" y="96.5" width="21" height="7" fill="black"/>
    </mask>
    <g id="unit">
      <polygon points="88,22 112,22 107.5,5 92.5,5"/>
      <rect x="96.5" y="37" width="7" height="39" rx="2.5"/>
    </g>
  </defs>
  <g mask="url(#hubH)">
    <use href="#unit"/>
    <use href="#unit" transform="rotate(45 100 100)"/>
    <use href="#unit" transform="rotate(90 100 100)"/>
    <use href="#unit" transform="rotate(135 100 100)"/>
    <use href="#unit" transform="rotate(180 100 100)"/>
    <use href="#unit" transform="rotate(225 100 100)"/>
    <use href="#unit" transform="rotate(270 100 100)"/>
    <use href="#unit" transform="rotate(315 100 100)"/>
    <circle cx="100" cy="100" r="71" fill="none" stroke="currentColor" stroke-width="16"/>
    <circle cx="100" cy="100" r="25"/>
  </g>
</svg>
