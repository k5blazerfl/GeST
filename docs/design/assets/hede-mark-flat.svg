<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="currentColor" role="img" aria-label="HeDE mark (single colour)">
  <title>HeDE mark — single colour</title>
  <defs>
    <mask id="notch">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <circle cx="152" cy="152" r="38" fill="black"/>
    </mask>
    <mask id="sealH">
      <rect x="0" y="0" width="200" height="200" fill="black"/>
      <circle cx="152" cy="152" r="33" fill="white"/>
      <rect x="143" y="140" width="6"  height="24" fill="black"/>
      <rect x="155" y="140" width="6"  height="24" fill="black"/>
      <rect x="143" y="149" width="18" height="6"  fill="black"/>
    </mask>
    <g id="unit">
      <rect x="95.5" y="34" width="9" height="42" rx="3"/>
      <rect x="94.5" y="1"  width="11" height="24" rx="5.5"/>
    </g>
  </defs>
  <g fill="currentColor">
    <g mask="url(#notch)">
      <use href="#unit"/>
      <use href="#unit" transform="rotate(45 100 100)"/>
      <use href="#unit" transform="rotate(90 100 100)"/>
      <use href="#unit" transform="rotate(135 100 100)"/>
      <use href="#unit" transform="rotate(180 100 100)"/>
      <use href="#unit" transform="rotate(225 100 100)"/>
      <use href="#unit" transform="rotate(270 100 100)"/>
      <use href="#unit" transform="rotate(315 100 100)"/>
      <circle cx="100" cy="100" r="72" fill="none" stroke="currentColor" stroke-width="13"/>
      <circle cx="100" cy="100" r="22"/>
    </g>
    <g mask="url(#sealH)"><circle cx="152" cy="152" r="33"/></g>
  </g>
</svg>
