# Seamless boot handoff. As greetd starts, tell Plymouth to quit but LEAVE its
# last frame on the framebuffer (--retain-splash). labwc then takes DRM master
# and draws the HeDE session over it; the splash's Harbor-navy background matches
# the wallpaper, so there's no black flash between splash and desktop. The leading
# '-' makes it a no-op if Plymouth isn't running (e.g. a BIOS boot with no efifb).
[Service]
ExecStartPre=-/usr/bin/plymouth quit --retain-splash
