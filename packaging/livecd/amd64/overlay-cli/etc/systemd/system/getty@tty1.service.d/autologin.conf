# GeSI CLI installer: autologin root on tty1 (the live medium has no root
# password). agetty logs root straight in; root's ~/.bash_profile then launches
# GeST's guided "Install Gentoo" TUI. tty2-6 keep their normal login getty.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
