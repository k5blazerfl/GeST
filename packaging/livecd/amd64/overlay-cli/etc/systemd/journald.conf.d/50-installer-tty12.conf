# GeSI CLI installer: stream warnings-and-worse to tty12 (Alt+F12).
#
# The installer TUI owns tty1 and GeST quiets kernel printk while it's up (so the
# wizard isn't scribbled over). Nothing is lost — journald forwards every message
# at priority "warning" or above (kernel and services alike) to a dedicated log
# console on tty12, so an operator can watch the noise live with Alt+F12 and come
# back to the installer with Alt+F1. This is independent of the kernel's
# console_loglevel, so it keeps working even while tty1 is quieted.
[Journal]
ForwardToConsole=yes
TTYPath=/dev/tty12
MaxLevelConsole=warning
