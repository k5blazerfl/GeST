<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy for the GeST backend. Install as:
      /usr/share/dbus-1/system.d/org.gentoo.gest.conf
  Only root may own the name and run the service; any user may call its
  methods, and polkit (not this policy) decides which actions they may take.
-->
<busconfig>
  <policy user="root">
    <allow own="org.gentoo.gest"/>
    <allow send_destination="org.gentoo.gest"/>
    <allow receive_sender="org.gentoo.gest"/>
  </policy>

  <policy context="default">
    <!-- Any user may call the service; polkit decides which actions are
         allowed. Not restricted per-interface so new modules (Services,
         …) work without editing this file. -->
    <allow send_destination="org.gentoo.gest"/>
    <allow receive_sender="org.gentoo.gest"/>
  </policy>
</busconfig>
