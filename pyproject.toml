[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gest"
version = "0.53.2"
description = "GeST — Gentoo System Tool: a modular, YaST-style system administration tool for Gentoo"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{ name = "GeST contributors" }]
keywords = ["gentoo", "portage", "system-administration", "tui", "yast"]

# The TUI frontend and the async backend client. Two system-provided packages
# are intentionally NOT listed here because on Gentoo they come from the OS,
# not PyPI, and the frontend venv must reuse them (--system-site-packages):
#   * portage      — the Portage Python API (queries)
#   * PyGObject    — GLib/Gio, used by the root backend service
dependencies = [
    "urwid>=2.1",
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=44"]
qt = ["PySide6"]
# Keychain vault (docs/design/keychain.md): Argon2id KDF + ChaCha20-Poly1305 AEAD.
# cryptography>=44 provides both the Argon2id KDF and the AEAD, so the vault needs
# no other crypto dependency. Maps to a `keychain` USE flag in the ebuild.
keychain = ["cryptography>=44"]

[project.scripts]
gest = "gest.tui.app:main"
gest-backend = "gest.backend.service:main"
gest-shell = "gest.shell.service:main"
gest-settings = "gest.qt.app:main"
# keychainctl — inspect/edit the keychain vault by hand (pre-Secret-Service-daemon).
keychainctl = "gest.tui.keychain.cli:main"
# helm-keyringd — the freedesktop Secret Service provider over the keychain vault.
helm-keyringd = "gest.keyringd.service:main"
# gangway — manage/launch RDP profiles; gangway-open is the .desktop Exec stub.
gangway = "gest.tui.gangway.cli:main"
gangway-open = "gest.tui.gangway.cli:open_main"
# gangway-rdp-open — the .rdp/rdp:// MIME handler stub (opens a target ad-hoc).
gangway-rdp-open = "gest.tui.gangway.cli:open_file_main"
# drydock — manage Wine/Proton bottles; drydock-run is the .desktop Exec stub.
drydock = "gest.tui.drydock.cli:main"
drydock-run = "gest.tui.drydock.cli:open_main"
# flotilla — manage VMs (vessels) over libvirt/QEMU.
flotilla = "gest.tui.flotilla.cli:main"
# gestd — the unprivileged core service (HeDE path-B read side); Phase-0 scaffold.
gest-core = "gest.coreservice.service:main"

[tool.setuptools.packages.find]
include = ["gest*"]

[tool.setuptools.package-data]
# The curated per-arch kernel config GeSI stages into the target for genkernel
# (gest.core.kernel.config). distutils-r1_src_install ships this into the package.
"gest.core.kernel" = ["config-*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Import gest straight from the repo root so CI needn't install the package.
pythonpath = ["."]
markers = [
    "needs_live_system: test_tui tests that need live Gentoo state (disks, installed packages, configured repos, @world updates) — run on a Gentoo host, deselected in the container CI job",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PLW"]
# subprocess.run without check= is intentional — we inspect returncode.
# PLW1510: subprocess.run w/o check= is intentional. RUF012: Textual
# BINDINGS/CSS are class-level lists by convention.
ignore = ["PLW1510", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() must run before importing from gi.repository.
"gest/backend/*" = ["E402"]
# dbus_next service interfaces annotate methods with D-Bus type SIGNATURES
# ("s", "a{sv}", "bs"), which are not Python type expressions — ruff must not try
# to parse or unquote them.
"gest/coreservice/hostname.py" = ["F722", "F821", "UP037"]
"gest/coreservice/software.py" = ["F722", "F821", "UP037"]
"gest/coreservice/services.py" = ["F722", "F821", "UP037"]
"gest/coreservice/users.py" = ["F722", "F821", "UP037"]
"gest/coreservice/network.py" = ["F722", "F821", "UP037"]
"gest/coreservice/disk.py" = ["F722", "F821", "UP037"]
"gest/coreservice/firewall.py" = ["F722", "F821", "UP037"]
"gest/coreservice/localization.py" = ["F722", "F821", "UP037"]
"gest/coreservice/sysctl.py" = ["F722", "F821", "UP037"]
"gest/coreservice/catalog.py" = ["F722", "F821", "UP037"]
# helm-keyringd's Secret Service objects — same D-Bus-signature annotations.
"gest/keyringd/service.py" = ["F722", "F821", "UP037"]
