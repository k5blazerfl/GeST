<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" role="img" aria-label="Helm wheel">
  <!-- The HeDE mark's ship's wheel (docs/design/assets/hede-mark-flat.svg),
       without the H seal so it is 8-fold radially symmetric and spins as a
       seamless loop. `currentColor` is substituted for the biome accent at
       render time. -->
  <defs>
    <g id="unit">
      <rect x="95.5" y="34" width="9" height="42" rx="3"/>
      <rect x="94.5" y="1" width="11" height="24" rx="5.5"/>
    </g>
  </defs>
  <g fill="currentColor">
    <use href="#unit"/>
    <use href="#unit" transform="rotate(45 100 100)"/>
    <use href="#unit" transform="rotate(90 100 100)"/>
    <use href="#unit" transform="rotate(135 100 100)"/>
    <use href="#unit" transform="rotate(180 100 100)"/>
    <use href="#unit" transform="rotate(225 100 100)"/>
    <use href="#unit" transform="rotate(270 100 100)"/>
    <use href="#unit" transform="rotate(315 100 100)"/>
    <circle cx="100" cy="100" r="72" fill="none" stroke="currentColor" stroke-width="13"/>
    <circle cx="100" cy="100" r="22"/>
  </g>
</svg>
