# HeDE CI. Dormant inside the GeST repo (workflows only run from a repo root);
# activates once this tree is extracted to its own `hede` repository.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang-format \
            qt6-base-dev qt6-wayland qt6-wayland-dev \
            liblayershellqtinterface-dev \
            labwc procps coreutils
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        # includes the headless labwc smoke test (skips gracefully if unavailable)
        run: ctest --test-dir build --output-on-failure
      - name: Format check
        run: |
          find src -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror
