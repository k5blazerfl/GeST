# HeDE wayfire config — the opt-in "effects" profile (desktop-environment.md §4).
# Same shell (helm-panel/helm-bg/helm-notifyd) on a compositor with animations,
# an expo overview and wobbly windows. GeST will generate this later.

[core]
plugins = autostart animate command move resize expo wobbly place vswitch window-rules

[autostart]
background = helm-bg
panel = helm-panel
notifications = helm-notifyd

[animate]
enabled = true

[wobbly]
friction = 3.0

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_lock = <super> KEY_L
command_lock = swaylock -f

# Expo: a Windows-style "show all workspaces" overview.
[expo]
toggle = <super> KEY_E
